on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release (e.g. v1.2.3)'
        required: false
        default: ''
      release_name:
        description: 'Release title/name'
        required: false
        default: ''
      release_body:
        description: 'Release notes / body (markdown)'
        required: false
        default: ''
      publish:
        description: 'When true the workflow will publish the release and marketplace package'
        required: false
        default: 'false'
      dryRun:
        description: 'When true the packaging step runs in dry-run mode'
        required: false
        default: 'true'

name: Deploy Extension
jobs:
  build:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: true
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        node:
          - 20
    outputs:
      vsixPath: ${{ steps.packageExtension.outputs.vsixPath }}
    steps:
      - name: Setup GIT for Windows
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
        if: runner.os == 'Windows'
      - name: Checkout Source
        uses: actions/checkout@v4
      - name: Install Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install Dependencies
        run: npm ci
      - name: Type check
        run: npm run check-types
      - name: Package Extension
        id: packageExtension
        uses: HaaLeo/publish-vscode-extension@v2
        with:
          pat: stub
          dryRun: true
      - name: Upload Extension Package as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: ${{ steps.packageExtension.outputs.vsixPath }}

  publish:
    name: Publish Github Action
    needs:
      - build
    if: github.event_name == 'release' || github.event.inputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: release   # stable OIDC subject: repo:audiofab/fv1-vscode:environment:release
    timeout-minutes: 10
    permissions:
      id-token: write   # required to request the GitHub OIDC token for Entra ID federation
      contents: read
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
      - name: Install Node v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Dependencies
        run: npm ci
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: ubuntu-latest
      - name: Azure Login (workload identity federation)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Publish to Visual Studio Marketplace
        run: npx --yes @vscode/vsce publish --azure-credential --packagePath "${{ needs.build.outputs.vsixPath }}"
