name: Bootstrap Publisher Identity

# TEMPORARY: run once to register the managed identity with Azure DevOps and
# print its profile id, which is the value to add to the Marketplace publisher.
# Delete this file once the identity has been added to the publisher.

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  get-profile:
    runs-on: ubuntu-latest
    environment: release   # must match the federated credential subject
    steps:
      - name: Azure Login (as the managed identity)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Register identity with Azure DevOps and print its profile
        run: |
          az rest \
            -u https://app.vssps.visualstudio.com/_apis/profile/profiles/me \
            --resource 499b84ac-1321-427f-aa17-267ca6975798
